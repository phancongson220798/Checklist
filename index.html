<script>
const ICSI=['Nguyễn Khắc Sinh','Nguyễn Văn Long','Đỗ Thị Kim Chi'];
var pend=false;let cases={},role=ls('role'),tab='tach',col=null,sync=false,tinp={},imp=null,ord=null,warn=null,seen=new Set(),themeI=+(ls('theme')||0),bgI=+(ls('bg')||0),srt=ls('srt')||'time',early=null,fin=null;
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){return null}}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hm=m=>{m=((Math.round(m)%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const pm=s=>{const[a,b]=s.split(':');return+a*60+ +b};
const nowM=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const hms=()=>{const d=new Date();return[d.getHours(),d.getMinutes(),d.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':')};
const secs=x=>{if(!x)return 0;const[a,b,c]=String(x).split(':');return+a*3600+ +b*60+ +(c||0)};

const mmss=d=>{d=Math.max(0,d);const x=String(d%60).padStart(2,'0');if(d>=3600)return Math.floor(d/3600)+':'+String(Math.floor(d%3600/60)).padStart(2,'0')+':'+x;return String(Math.floor(d/60)).padStart(2,'0')+':'+x};

const nt=v=>{const m=String(v).match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);if(!m||+m[1]>23||+m[2]>59||+(m[3]||0)>59)return null;return m[1].padStart(2,'0')+':'+m[2]+':'+(m[3]||'00')};

function sorted(l,m){return l.slice().sort(m==='stt'?(a,b)=>no(bs(a))-no(bs(b))||key(bs(a))-key(bs(b))||rk(a)-rk(b):(a,b)=>key(bs(a))-key(bs(b))||no(bs(a))-no(bs(b))||rk(a)-rk(b))}
const TH=[['Indigo','#5e6ad2','#5e6ad2'],['Teal','#14a38b','#14a38b'],['Rose','#d6457a','#d6457a'],['Amber','#c98a0b','#c98a0b'],['Xanh lá','#27a644','#27a644']];

function applyBg(i){const r=document.documentElement.style,b=BG[i]||BG[0],c=b[1];['--canvas','--card','--bg','--line','--ink','--mut','--warn','--ok'].forEach(k=>r.removeProperty(k));r.colorScheme='';
if(b[2]){r.setProperty('--canvas',c);r.setProperty('--card','#ffffff');r.setProperty('--bg','#eceef2');r.setProperty('--line','#dcdfe5');r.setProperty('--ink','#14171c');r.setProperty('--mut','#6b7280');r.setProperty('--warn','#b86e00');r.setProperty('--ok','#1f8a3b');r.colorScheme='light';return}
if(!i)return;r.setProperty('--canvas',c);r.setProperty('--card',`color-mix(in srgb,${c} 91%,#fff)`);r.setProperty('--bg',`color-mix(in srgb,${c} 86%,#fff)`);r.setProperty('--line',`color-mix(in srgb,${c} 82%,#fff)`)}

const LK='icsi_cases_v1';let LAST='',BC=null;function lsave(){LAST=JSON.stringify(cases);ls(LK,LAST);try{BC&&BC.postMessage(1)}catch(e){}}

function save(id,p){cases[id]={...cases[id],...p};render();if(col)col.doc(id).set(cases[id]).catch(()=>{});else if(RT)rtw(id,p);else lsave()}

const bootDB=async()=>{try{const db=window.claude&&await claude.use('db');if(!db){fallback();return}col=db.collection('cases');
col.onSnapshot(s=>{cases={};s.docs.forEach(d=>cases[d.id]=d.data());if(!ord||!ord.length)resort();sync=true;render()},()=>{sync=false})}catch(e){try{fallback()}catch(x){lmode()}}};
/* ĐIỀN 2 DÒNG NÀY: địa chỉ Realtime Database và mã phòng (≥16 ký tự). Sau khi điền, mọi thiết bị tự đồng bộ. */
const SYNC={url:'https://checklist-77869-default-rtdb.asia-southeast1.firebasedatabase.app',room:'ON7IW63tHbK74JlRARrvAbpbz3bF'};
const SYNC_OK=()=>SYNC.url&&SYNC.room&&!/TEN-DU-AN|DAT-MA-PHONG/.test(SYNC.url+SYNC.room);var RT=null;
const kid=id=>String(id).replace(/[.$#\[\]\/]/g,'_');
function syncCfg(){try{const q=new URLSearchParams(location.search);if(q.get('fb')){ls('fb_url',q.get('fb'));ls('fb_room',q.get('room')||'')}}catch(e){}const url=((SYNC_OK()?SYNC.url:ls('fb_url'))||'').trim().replace(/\/+$/,''),room=((SYNC_OK()?SYNC.room:ls('fb_room'))||'').trim();return url&&room?{url,room}:null}
function fallback(){const c=syncCfg();c?rtmode(c):lmode()}
function cloudChip(){if(RT&&RTERR)return `<button class="chip" data-a="cloudinfo" style="color:var(--warn);border-color:var(--warn)">⚠ Không ghi được</button>`;if(SYNC_OK()&&RT)return `<span class="chip">${sync?'☁ Đã đồng bộ':'☁ Mất kết nối'}</span>`;return `<button class="chip" data-a="cloud" title="Cấu hình đồng bộ nhiều thiết bị">${RT?(sync?'☁ Đã đồng bộ':'☁ Mất kết nối'):'☁ Đồng bộ'}</button>`}
var RTERR='';
function rtw(id,p){const k=encodeURIComponent(kid(id)),u=`${RT}/cases/${k}.json`;try{fetch(u,cases[id]?{method:'PATCH',body:JSON.stringify({...p,id:cases[id].id||id})}:{method:'DELETE'}).then(r=>{if(r.ok){if(RTERR){RTERR='';render()}}else r.text().then(t=>{RTERR=r.status+' '+t.slice(0,160);console.error('Firebase từ chối ghi:',RTERR);render()})}).catch(e=>{RTERR='Lỗi mạng: '+e.message;console.error(RTERR);render()})}catch(e){}}
function rtmode(c){RT=`${c.url}/rooms/${encodeURIComponent(c.room)}`;let raw={};
const build=()=>{cases={};Object.keys(raw).forEach(k=>{const o=raw[k];if(o&&typeof o==='object')cases[o.id||k]=o});if(!ord||!ord.length)resort();render()};
const setp=(path,data)=>{const ps=path.split('/').filter(Boolean);if(!ps.length){raw=data&&typeof data==='object'?data:{};return}let o=raw;for(let i=0;i<ps.length-1;i++){if(!o[ps[i]]||typeof o[ps[i]]!=='object')o[ps[i]]={};o=o[ps[i]]}const l=ps[ps.length-1];if(data===null||data===undefined)delete o[l];else o[l]=data};
const es=new EventSource(`${RT}/cases.json`);
es.addEventListener('open',()=>{sync=true;render()});
es.addEventListener('put',e=>{const m=JSON.parse(e.data);setp(m.path,m.data);build()});
es.addEventListener('patch',e=>{const m=JSON.parse(e.data),b=m.path==='/'?'':m.path;Object.keys(m.data||{}).forEach(k=>setp(b+'/'+k,m.data[k]));build()});
es.addEventListener('cancel',()=>{sync=false;RTERR='Không có quyền đọc (kiểm tra Rules)';render()});es.onerror=()=>{sync=false;render()};render()}
function lmode(){LAST=ls(LK)||'{}';try{cases=JSON.parse(LAST)||{}}catch(e){cases={}}if(!ord||!ord.length)resort();render();window.addEventListener('storage',e=>{if(e.key===LK)lsync()});try{BC=new BroadcastChannel('icsi_sync');BC.onmessage=lsync}catch(e){}setInterval(lsync,1000)}

function tm(v){if(typeof v==='number')return hm(v*1440);const m=String(v||'').match(/(\d{1,2}):(\d{2})/);return m?hm(+m[1]*60+ +m[2]):null}
function sp(r){const n=['PESA','TESE','MicroTESE','Rã tinh trùng','Đông tinh','Xin tinh trùng'].filter(k=>String(r[k]).toUpperCase()==='YES');return n.length?{sperm:'khac',spermNote:n.join(', ')}:{sperm:'tuoi',spermNote:''}}
function parse(buf){const wb=XLSX.read(buf,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];
return XLSX.utils.sheet_to_json(ws,{defval:''}).map(r=>{const o={};for(const k in r)o[k.replace(/\s+/g,' ').trim()]=r[k];return o})
.filter(r=>r['MHS']&&tm(r['Giờ HcG'])).map(r=>({id:String(r['MHS']).trim(),stt:r['STT'],name:r['Vợ'],dobW:r['NS vợ'],husband:r['Chồng'],dobH:r['NS chồng'],hcg:tm(r['Giờ HcG']),ch:tm(r['Giờ CH'])||'',bs:r['BS chọc hút'],para:String(r['PARA']||'').padStart(4,'0'),nang:r['Số nang SA'],allergy:r['Dị ứng'],note:String(r['Lịch sử nơi khác']||'').trim(),date:r['Ngày CH'],...sp(r),eggs:'',sttch:String(r['STT CH']??''),pos:'',cdcp:String(r['Chỉ định ngày CP']||'').trim(),cdtru:String(r['Chỉ định trữ']||'').trim(),cdsb:String(r['Chỉ định ngày sinh thiết']||'').trim(),dongtrung:Number(r['Đông trứng'])||0}))}

const POS=['BT371-T','BT371-P','BT372-T','BT372-P','BT373-T','BT373-P','BT374-T','BT374-P','BT375-T','BT375-P'];

const nmx=(c,nn)=>{const al=c.allergy&&c.allergy!=='Không',op=openI.has(c.id);return `${c.nang!==''&&!nn?`<span class="tag nang">Nang SA: ${esc(c.nang)}</span>`:''}<button class="ib${op?' on':''}${al?' al':''}" data-a="info" data-id="${esc(c.id)}" title="Thông tin thêm">i</button>${c.dongtrung>0?`<span class="tag fzt">Đông trứng ${c.dongtrung}</span>`:''}`};
const det=(c,ex)=>{if(!openI.has(c.id))return '';const id=esc(c.id),s=c.sperm||'tuoi',al=c.allergy&&c.allergy!=='Không',cd=[c.cdcp&&'CP '+c.cdcp,c.cdtru,c.cdsb&&'D5/D5'].filter(Boolean).map(t=>`<span class="tag cd">${esc(t)}</span>`).join('');
return `${ex?`<div class="meta mini">${isR(c)?'<span class="tag rtt">Rã trứng</span><span class="tag">Ủ 2 giờ</span>':`${gh(c)}${ic(c)}<span class="tag cd">Giờ 41 · ${hm(key41(c))}</span>`}<span class="tag">Xong ${esc(c.done)}</span>${c.note?`<span class="sub">${esc(c.note)}</span>`:''}</div>`:''}<div class="meta mini"><span class="sub">PARA ${esc(c.para)} · ${esc(c.bs)}</span>${cd}${al?`<span class="tag w">Dị ứng: ${esc(c.allergy)}</span>`:''}<button class="tag spb ${s==='khac'?'k':''}" data-a="sp" data-id="${id}" data-v="${s==='khac'?'tuoi':'khac'}">${s==='khac'?'Tinh trùng khác':'Tinh trùng tươi'}</button>${s==='khac'?`<input class="eg2" data-n="spermNote" data-id="${id}" value="${esc(c.spermNote||'')}">`:''}</div>`};
const distT=c=>(c.d1||c.d2)?`${c.d1||0}-${c.d2||0}`:'–';

function due(c){let d=((key(c)%1440-nowM())%1440+1440)%1440;if(d>720)d-=1440;return d}
const hf=c=>`<div class="hf"><div><small>HcG · CH ${esc(c.ch)}</small><b>${c.hcg}</b></div>${c.mode?`<div class="gc g${c.mode}"><small>Giờ ${c.mode}</small><b>${hm(key(c))}</b></div>`:''}</div>`;

function doUndo(a,id){const c=cases[id];if(!c)return render();if(a==='unprep')save(id,{mode:null,ok:false});else if(a==='rtun'){RTN.delete(id);save(id,{rtStart:null})}else if(a==='unasg')save(id,{assignee:null,ack:false,chg:c.assignee?{from:c.assignee,to:null,why:'thu hồi về chờ tiêm',at:Date.now()}:null});else if(a==='undo'){resort();save(id,{prevDone:c.done||null,done:null,assignee:null,ack:false,chg:c.assignee?{from:c.assignee,to:null,why:'hoàn tác tách trứng',at:Date.now()}:null})}}
function okAll(){Object.values(cases).filter(c=>!c.done&&c.mode&&!c.ok&&!isR(c)&&chocOn(c)).forEach(c=>save(c.id,{ok:true}))}
const ACK={seen:+(ls('ackSeen')||0)||Date.now()-120000};
function toast(c){const box=document.getElementById('toasts');if(!box)return;const d=document.createElement('div');d.className='toast';d.innerHTML=`<b>${esc(c.assignee)}</b> đã nhận ca <b>${esc(c.sttch||c.stt||'')}</b> · ${esc(c.name)}`;box.appendChild(d);requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.add('in')));const rm=()=>{d.classList.remove('in');setTimeout(()=>d.remove(),320)};d.onclick=rm;setTimeout(rm,9000);
try{navigator.vibrate&&navigator.vibrate(120)}catch(e){}
try{if(document.hidden&&'Notification' in window&&Notification.permission==='granted')new Notification(c.assignee+' đã nhận ca '+(c.sttch||c.stt||''),{body:c.name,tag:'ack'+c.id})}catch(e){}}
function ackCheck(){if(role!=='admin')return;const L=Object.values(cases).filter(c=>c.ack&&c.ackAt&&c.ackAt>ACK.seen).sort((a,b)=>a.ackAt-b.ackAt);if(!L.length)return;ACK.seen=L[L.length-1].ackAt;ls('ackSeen',String(ACK.seen));L.forEach(c=>{const n=c.sttch||c.stt||'';toastT(`<b>${esc(c.assignee)}</b> đã nhận ca <b>${esc(n)}</b> · ${esc(c.name)}`,`${c.assignee} đã nhận ca ${n} · ${c.name}`)})}
/* ===== Mượt: cập nhật DOM theo khác biệt + FLIP ===== */
(()=>{const el=document.getElementById('app'),d=Object.getOwnPropertyDescriptor(Element.prototype,'innerHTML');
const clean=n=>{[...n.childNodes].forEach(c=>{if(c.nodeType===3){if(!c.nodeValue.trim()&&c.nodeValue.includes('\n'))n.removeChild(c)}else if(c.nodeType===1)clean(c)})};
const attrs=(x,y)=>{[...x.attributes].forEach(a=>{if(!y.hasAttribute(a.name))x.removeAttribute(a.name)});[...y.attributes].forEach(a=>{if(x.getAttribute(a.name)!==a.value)x.setAttribute(a.name,a.value)})};
const same=(x,y)=>x.nodeType===y.nodeType&&x.nodeName===y.nodeName;
const key=n=>n.nodeType===1&&n.dataset.k;
function kids(p,q){const nw=[...q.childNodes],map=new Map();[...p.childNodes].forEach(n=>{const k=key(n);if(k)map.set(k,n)});let i=0;
nw.forEach(n=>{const cur=p.childNodes[i],k=key(n);
if(k){const m=map.get(k);if(m){map.delete(k);if(cur!==m)p.insertBefore(m,cur||null);one(m,n)}else p.insertBefore(n,cur||null)}
else if(cur&&!key(cur)&&same(cur,n))one(cur,n);else p.insertBefore(n,cur||null);i++});
while(p.childNodes.length>i)p.removeChild(p.lastChild)}
function one(x,y){if(x.nodeType!==1){if(x.nodeValue!==y.nodeValue)x.nodeValue=y.nodeValue;return}
if(x.tagName==='INPUT'){attrs(x,y);if(document.activeElement!==x){if(x.type==='checkbox')x.checked=y.hasAttribute('checked');else{const v=y.getAttribute('value')||'';if(x.value!==v)x.value=v}}return}
if(x.tagName==='SELECT'){const so=y.querySelector('option[selected]');attrs(x,y);kids(x,y);x.value=so?so.value:(x.options[0]?x.options[0].value:'');return}
attrs(x,y);kids(x,y)}
Object.defineProperty(el,'innerHTML',{configurable:true,get(){return d.get.call(el)},set(h){
if(!el.firstChild){d.set.call(el,h);clean(el);return}
const t=document.createElement('div');d.set.call(t,h);clean(t);clean(el);
const pos=new Map();el.querySelectorAll('main [data-k]').forEach(n=>pos.set(n.dataset.k,n.getBoundingClientRect()));
kids(el,t);
if(!matchMedia('(prefers-reduced-motion:reduce)').matches)el.querySelectorAll('main [data-k]').forEach(n=>{const o=pos.get(n.dataset.k);if(!o)return;const r=n.getBoundingClientRect(),dx=o.left-r.left,dy=o.top-r.top;if(Math.abs(dx)>2||Math.abs(dy)>2)n.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:280,easing:'cubic-bezier(.2,.8,.2,1)'})})}})})();

/* ===== Cảnh báo ca mới cho người tiêm (khi ẩn/thu nhỏ cửa sổ) ===== */
const AL={on:false,shown:new Set(),tt:document.title,wl:null,n:0};
function alPending(){return role&&role!=='admin'?Object.values(cases).filter(c=>c.assignee===role&&!c.ack):[]}
function alNotify(c){note('Ca mới · '+(c.sttch||c.stt||'')+' · '+c.name+' · '+hms());try{if('Notification' in window&&Notification.permission==='granted'){const n=new Notification('Ca mới: '+c.name,{body:`STT ${c.sttch||c.stt||''} · Phân bố ${distT(c)} · Vị trí ${c.pos||'–'}`,tag:'ca'+c.id,requireInteraction:true,renotify:true});n.onclick=()=>{window.focus();n.close()}}}catch(e){}}
function alStart(){AL.on=true}
function alStop(){if(!AL.on)return;AL.on=false;document.title=AL.tt}
function alCheck(){const p=alPending(),ids=new Set(p.map(c=>c.id));
p.forEach(c=>{if(!AL.shown.has(c.id)){AL.shown.add(c.id);alNotify(c)}});
[...AL.shown].forEach(i=>{if(!ids.has(i))AL.shown.delete(i)});
if(p.length)alStart();else alStop()}
async function alWake(){try{if('wakeLock' in navigator&&!AL.wl&&role&&role!=='admin'){AL.wl=await navigator.wakeLock.request('screen');AL.wl.addEventListener('release',()=>{AL.wl=null})}}catch(e){}}
function alEnable(){alWake();try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission().then(render)}catch(e){}render()}
function alChip(){const ok='Notification' in window&&Notification.permission==='granted',no='Notification' in window&&Notification.permission==='denied';return `<button class="chip" data-a="aln" title="${no?'Trình duyệt đang chặn thông báo, hãy mở khóa trong cài đặt trang':'Bật thông báo pop-up khi có ca mới'}">${ok?'🔔 Đang bật':no?'🔕 Bị chặn':'🔔 Bật thông báo'}</button>`}
const EV={seen:+(ls('evSeen')||0)||Date.now()-120000};
function evCheck(){if(role!=='admin')return;const L=[];Object.values(cases).forEach(c=>{[['doneAt',isR(c)?'Rã trứng xong':'Tách xong',c.done],['ackAt','Nhận ICSI',c.ack?new Date(c.ackAt||0).toTimeString().slice(0,8):null],['icsiAt','ICSI xong',c.icsiDone]].forEach(([k,a,t])=>{if(t&&c[k]&&c[k]>EV.seen)L.push({at:c[k],a,c,t})})});if(!L.length)return;L.sort((x,y)=>x.at-y.at);EV.seen=L[L.length-1].at;ls('evSeen',String(EV.seen));L.forEach(({a,c,t})=>{const n=c.sttch||c.stt||'';toastT(`<b>${esc(a)}</b> · ${esc(n)} · ${esc(c.name)} · ${esc(t)}`,`${a} · ${n} · ${c.name} · ${t}`)})}
var selK=null;function applySel(){document.querySelectorAll('main [data-k]').forEach(e=>e.classList.toggle('sel',!!selK&&e.dataset.k===selK))}
document.addEventListener('click',e=>{if(e.target.closest('.ov,header,.thp'))return;const c=e.target.closest('main [data-k]');const k=c?c.dataset.k:null;if(k!==selK){selK=k;applySel()}},true);
document.addEventListener('focusin',e=>{const c=e.target.closest&&e.target.closest('main [data-k]');if(c&&c.dataset.k!==selK){selK=c.dataset.k;applySel()}});
const _r=render;render=function(){_r();applySel();alCheck();evCheck();chgCheck()};
setInterval(()=>{if(AL.on){AL.n++;document.title=AL.n%2?'🔔 CA MỚI – '+AL.tt:AL.tt;if(AL.n%3===0)try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}},1000);
document.addEventListener('focusout',()=>{if(pend){pend=false;setTimeout(render,60)}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)alWake()});
setInterval(()=>{if(!document.hidden)tick()},1000);
document.addEventListener('input',e=>{const t=e.target;if(t.classList.contains('tm')){const d=t.value.replace(/\D/g,'').slice(0,6);t.value=d.length>4?d.slice(0,2)+':'+d.slice(2,4)+':'+d.slice(4):d.length>2?d.slice(0,2)+':'+d.slice(2):d}if(t.dataset.t)tinp[t.dataset.t]=t.value;if(t.dataset.fin&&fin)fin[t.dataset.fin]=t.value});
document.addEventListener('change',async e=>{const t=e.target;
if(t.id==='f'&&t.files[0]){try{imp=parse(await t.files[0].arrayBuffer());imp.forEach(c=>c._s=true);if(!imp.length){alert('File không hợp lệ');imp=null}}catch(x){alert('Không đọc được file');imp=null}render()}
if(t.dataset.i!==undefined){imp[+t.dataset.i]._s=t.checked;const e=document.querySelector('.impw .sub');if(e)e.textContent=imp.filter(c=>c._s).length+'/'+imp.length+' ca được chọn'}if(t.dataset.ps){const v=t.value;t.blur();const f=t.dataset.f||'pos';save(t.dataset.ps,v==='__x'?{[f+'x']:true,[f]:''}:{[f+'x']:false,[f]:v})}else if(t.dataset.n==='done'){const v=nt(t.value);t.blur();if(v)save(t.dataset.id,{done:v});else render()}else if(t.dataset.n==='rtT'){const v=nt(t.value)||'';t.blur();save(t.dataset.id,{rtT:v})}else if(t.dataset.t){const v=nt(t.value);if(v){t.blur();resort();save(t.dataset.t,{done:v});delete tinp[t.dataset.t]}}else if(t.dataset.n)saveQ(t.dataset.id,{[t.dataset.n]:t.value})})
document.addEventListener('click',e=>{if(thOpen&&!e.target.closest('.thp,[data-a="thm"]')){thOpen=false;render()}const b=e.target.closest('[data-a]');if(!b)return;const{a,id,v}=b.dataset;if(role&&role!=='admin'&&tab==='tach'&&!['tab','info','thm','theme','bg','nlog','nlclose','nlclr','out','srt','cfno','aln','ack','ackall'].includes(a))return;if(a==='unprep'||a==='undo'||a==='unasg'||a==='rtun'){cf={a,id};render();return}
if(a==='role'){role=v;ls('role',v);render();alEnable()}
else if(a==='aln')alEnable()
else if(a==='cloudinfo')alert('Firebase từ chối ghi dữ liệu:\n'+RTERR+'\n\nHãy kiểm tra Realtime Database > Rules đã Publish đúng chưa (xem hướng dẫn).')
else if(a==='cloud'){const u=prompt('Địa chỉ Firebase Realtime Database (https://….firebasedatabase.app):',ls('fb_url')||'');if(u===null)return;const r=prompt('Mã phòng (chuỗi dài, bí mật, dùng chung cho mọi thiết bị):',ls('fb_room')||'');if(r===null)return;ls('fb_url',u.trim());ls('fb_room',r.trim());location.reload()}
else if(a==='out'){role=null;ls('role',null);render()}
else if(a==='tab'){tab=v;resort();render()}
else if(a==='kind'){b.blur();setKind(id,v,b.checked,b)}
else if(a==='rtok')rtOk(id)
else if(a==='rtfin'){const c=cases[id];if(c&&rtLeft(c)<=0){fin={id,d1:'',d2:'',pos:c.pos||'',t:hms()};render()}}
else if(a==='rtpok'){RTP=[];render()}
else if(a==='mode')save(id,{mode:+v})
else if(a==='sp')save(id,{sperm:v})
else if(a==='theme'){themeI=+v;ls('theme',v);applyTheme(themeI);render()}
else if(a==='thm'){thOpen=!thOpen;render()}
else if(a==='bg'){bgI=+v;ls('bg',v);applyBg(bgI);render()}
else if(a==='savemode'){seen.delete('t'+id);resort();render()}
else if(a==='sort'){resort();render()}
else if(a==='now'){const c=cases[id];if(due(c)>0){early=id;render()}else{fin={id,d1:'',d2:'',pos:c.pos||'',t:hms()};render()}}
else if(a==='eback'){early=null;render()}
else if(a==='ego'){const c=cases[early];fin={id:early,d1:'',d2:'',pos:c.pos||'',t:hms()};early=null;render()}
else if(a==='fcancel'){fin=null;render()}
else if(a==='fsave'){const x=fin;fin=null;resort();save(x.id,{done:x.t,doneAt:Date.now(),d1:x.d1,d2:x.d2,pos:x.pos,...(cases[x.id]&&isR(cases[x.id])?{incub:false}:{})})}
else if(a==='info'){openI.has(id)?openI.delete(id):openI.add(id);render()}
else if(a==='srt'){srt=v;ls('srt',v);render()}
else if(a==='okprep')save(id,{ok:true})
else if(a==='nlog'){nl=true;render()}
else if(a==='nlclose'){nl=false;render()}
else if(a==='nlclr'){NL=[];ls('nlog','[]');render()}
else if(a==='xls')xls()
else if(a==='cfno'){cf=null;render()}
else if(a==='cfyes'){const q=cf;cf=null;if(q&&q.a==='idone')finIcsi(q.id);else if(q)doUndo(q.a,q.id);else render()}
else if(a==='confirm'){const m=Object.values(cases).filter(c=>!c.done&&!c.mode&&!isR(c)&&chocOn(c));if(m.length){warn=m.map(c=>c.id)}else resort();render()}
else if(a==='okall'){const m=Object.values(cases).filter(c=>!c.done&&!rdy(c)&&!c.mode&&!isR(c)&&chocOn(c));if(m.length){warn=m.map(c=>c.id);warnOk=true;render()}else okAll()}
else if(a==='wback'){warn=null;warnOk=false;render()}
else if(a==='wgo'){warn=null;if(warnOk){warnOk=false;okAll()}else{resort();render()}}
else if(a==='time'){if(tinp[id]){resort();save(id,{done:tinp[id]});delete tinp[id]}}
else if(a==='inc')save(id,{incub:v==='1'})
else if(a==='asg'){if(cases[id]?.assignee!==v)save(id,{assignee:v,ack:false,icsiDone:null,asgAt:Date.now(),chg:cases[id].assignee?{from:cases[id].assignee,to:v,at:Date.now()}:null})}
else if(a==='unasg')save(id,{assignee:null,ack:false})
else if(a==='undo'){resort();save(id,{done:null,assignee:null,ack:false})}
else if(a==='ack')save(id,{ack:true,ackAt:Date.now()})
else if(a==='ackall')Object.values(cases).filter(c=>c.assignee===role&&!c.ack).forEach(c=>save(c.id,{ack:true,ackAt:Date.now()}))
else if(a==='idone'){const c=cases[id];if(c.incub&&incLeft(c)>0){cf={a:'idone',id};render();return}finIcsi(id)}
else if(a==='all'){imp.forEach(c=>c._s=true);render()}
else if(a==='cancel'){imp=null;render()}
else if(a==='ok'){imp.filter(c=>c._s).forEach(c=>{delete c._s;if(!cases[c.id])save(c.id,c)});imp=null;resort();render()}
else if(a==='clear'){if(confirm('Xóa tất cả ca?'))Object.keys(cases).forEach(del)}})
bootDB();
render();
</script></body></html>
