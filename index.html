if(!c.done){return `<div class="card${nw}${fz(c)}${c.incub?' uo':''}" data-k="t${c.id}" data-tk="${key(c)%1440}">${head(c,'',3)}${tiles(c)}<div class="meta">${ic(c)}<span class="sp"></span><button class="btn ar" data-a="unprep" data-id="${id}" title="Về chuẩn bị">↩</button><button class="btn pri ar" data-a="now" data-id="${id}">Xong</button></div></div>`}
return `<div class="card done${nw}${fz(c)}" data-k="t${c.id}">${head(c,`<div class="dd"><input class="tm" inputmode="numeric" maxlength="8" placeholder="HH:MM:SS" data-n="done" data-id="${id}" value="${c.done}"><button class="btn ghost ar" data-a="undo" data-id="${id}" title="Hoàn tác">↩</button></div>`)}${cnt(c)}</div>`}
const sn=n=>n.split(' ').pop();
const fz=c=>c.dongtrung>0?' fz':'';
function cardIcsi(c){const id=esc(c.id),rd=ready(c),nw=seen.has('i'+c.id)?'':' new',adm=role==='admin',mine=adm||role===c.assignee,wt=!c.icsiDone&&c.incub&&incLeft(c)>0;
const names=adm&&!c.icsiDone?ICSI.map(n=>`<button class="btn${c.assignee===n?' on':''}" data-a="asg" data-id="${id}" data-v="${esc(n)}" title="${esc(n)}">${esc(sn(n))}</button>`).join(''):'';
const acts=c.icsiDone?'':`${adm&&c.assignee?`<button class="btn ar" data-a="unasg" data-id="${id}" title="Về chờ tiêm">↩</button>`:''}${mine&&c.assignee?`<button class="btn pri ar" data-a="idone" data-id="${id}" title="Tiêm xong"${wt?' disabled':''}>✓</button>`:''}`;
const st=c.icsiDone?`<div class="stc dn">Xong ${c.icsiDone}</div>`:`<div class="stc" data-st data-rd="${rd}" data-dn="${esc(c.done)}" data-u="${c.incub?1:0}" data-as="${c.assignee?1:0}"></div>`;
return `<div class="card ${c.icsiDone?'done':''}${nw}${fz(c)}${wt?' pre':''}" data-k="i${c.id}"${c.icsiDone?'':` data-h41="${h41(c)}"`}>${head(c,st,2)}<div class="rr"><div class="dp2"><small>Phân bố</small><b>${esc(distT(c))}</b></div><div class="dp2"><small>Vị trí</small><b>${esc(c.pos||'–')}</b></div>${names||acts?`<div class="row">${names}${acts}</div>`:''}</div>${c.icsiDone?'':'<div class="w41b" data-w41></div>'}</div>`}

function vTach(){const all=Object.values(cases);
if(!all.length)return `<div class="empty">Chưa có ca</div>`;
const nd=all.filter(c=>!c.done),a=sorted(nd.filter(c=>!rdy(c)),'stt'),b=sorted(nd.filter(rdy),srt),d=sorted(all.filter(c=>c.done&&!c.icsiDone),'time'),em=t=>`<div class="empty">${t}</div>`,sb=(v,l)=>`<button class="btn${srt===v?' on':''}" style="padding:6px 10px;font-size:13px" data-a="srt" data-v="${v}">${l}</button>`;
return `<div class="cols3"><section class="pane p0"><h3>Chuẩn bị <span class="badge">${a.length}</span></h3>${a.map(cardPrep).join('')||em('Hết ca chuẩn bị')}</section><section class="pane p1"><h3>Chờ tách <span style="display:flex;gap:6px;align-items:center">${sb('time','Giờ tách')}${sb('stt','Thứ tự')}<span class="badge" style="background:var(--warn)">${b.length}</span></span></h3>${b.map(cardTach).join('')||em('Hết ca chờ')}</section><section class="pane p2"><h3>Đã tách <span class="badge" style="background:var(--ok)">${d.length}</span></h3>${d.map(cardTach).join('')||em('Trống')}</section></div>`}

function vIcsi(){const all=Object.values(cases),hg=c=>pm(c.hcg);
const tot=all.length,dn=all.filter(c=>c.icsiDone).length;
const wait=all.filter(c=>c.done&&!c.assignee).sort((a,b)=>hg(a)-hg(b)||no(a)-no(b));
const srt2=(a,b)=>(a.icsiDone?1:0)-(b.icsiDone?1:0)||(a.icsiDone?no(a)-no(b):hg(a)-hg(b)||no(a)-no(b));
const colh=(h,n,me,l)=>`<div class="col${me?' me':''}"><h3><span class="nmh${me?' on':''}">${h}</span><span class="badge">${n}</span></h3>${l.map(c=>cardIcsi(c)).join('')||'<div class="empty">Trống</div>'}</div>`;
return `<div id="al41" class="al41"></div><div class="sumr"><span>Đã tiêm xong <b>${dn}/${tot}</b></span><span>Còn lại <b>${tot-dn}</b></span></div><div class="cols4">${colh('Chờ tiêm',wait.length,false,wait)}${ICSI.map(n=>{const l=all.filter(c=>c.assignee===n).sort(srt2),d=l.filter(c=>c.icsiDone).length;return colh(esc(n),`${d}/${l.length}`,n===role,l)}).join('')}</div>`}

function render(){const a=$('#app'),sy=window.scrollY;if(!role){a.innerHTML=`<div class="ov"><div class="pop"><h1>Kiểm <b>quy trình</b> ICSI</h1><div class="sub">Chọn vai trò</div><div class="login"><button class="btn" data-a="role" data-v="admin">Quản lý</button>${ICSI.map(n=>`<button class="btn" data-a="role" data-v="${esc(n)}">${esc(n)}</button>`).join('')}</div></div></div>`;return}
const adm=role==='admin';if(!adm)tab='icsi';
const act=document.activeElement;if(act&&(act.tagName==='SELECT'||act.tagName==='INPUT'&&(act.dataset.t||act.dataset.n||act.dataset.fin))){pend=true;return}
let body=tab==='tach'?vTach():tab==='icsi'?vIcsi():`<div class="ph"><b>Rửa PI</b></div>`;
let pop='';if(!adm){const L=Object.values(cases).filter(c=>c.assignee===role&&!c.ack).sort((a,b)=>(a.asgAt||0)-(b.asgAt||0));if(L.length){try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
pop=`<div class="ov"><div class="pop"><div class="sub pulse" style="display:inline-block;border-radius:99px;padding:2px 10px;background:var(--ac2);color:var(--ac)">Ca mới · ${L.length}</div><div style="max-height:60vh;overflow:auto;margin-top:8px">${L.map(c=>`<div class="li" style="align-items:center;gap:10px"><span style="flex:1;min-width:0"><b>${esc(c.sttch||c.stt||'')}. ${esc(c.name)}</b><div class="sub">Nang SA ${esc(c.nang)} · Phân bố <b>${esc(distT(c))}</b> · Vị trí <b>${esc(c.pos||'–')}</b></div></span><button class="btn pri ar" data-a="ack" data-id="${esc(c.id)}" title="Đã nhận">✓</button></div>`).join('')}</div>${L.length>1?`<button class="btn pri" style="width:100%;margin-top:14px;padding:16px" data-a="ackall">Đã nhận tất cả</button>`:''}</div></div>`}}
if(imp)pop+=`<div class="ov"><div class="pop impw"><h1>Chọn ca</h1><div class="sub">${imp.filter(c=>c._s).length}/${imp.length} ca được chọn</div><div class="implist">${imp.map((c,i)=>`<label class="li"><input type="checkbox" data-i="${i}" ${c._s?'checked':''}><span><b>${esc(c.stt)}. ${esc(c.name)}</b> <span class="sub">HcG ${c.hcg} · ${esc(c.date)}</span></span></label>`).join('')}</div><div class="row"><button class="btn" data-a="all">Chọn tất cả</button><button class="btn" data-a="cancel">Hủy</button><button class="btn pri" data-a="ok">Nhập</button></div></div></div>`;
a.innerHTML=`<header><h1>Kiểm <b>quy trình</b> ICSI</h1>${adm?`<nav>${[['tach','Tách trứng'],['icsi','ICSI'],['pi','Rửa PI']].map(([k,l])=>`<button class="${tab===k?'on':''}" data-a="tab" data-v="${k}">${l}</button>`).join('')}</nav>`:''}<span class="sp"></span><button class="chip" data-a="thm">Giao diện</button><span class="sub"><span class="dot ${sync?'on':''}"></span>${sync?'Đồng bộ':'Cục bộ'}</span><span class="clock" id="clk"></span>${adm?`<label class="chip">Nhập Excel<input id="f" type="file" accept=".xls,.xlsx" hidden></label><button class="chip" data-a="clear">Xóa ca</button>`:''}${col?'':cloudChip()}${adm?'':alChip()}<button class="chip" data-a="out">${adm?'Quản lý':esc(role)}</button></header>${thOpen?THP():''}<main>${body}</main>${pop}`;document.querySelectorAll('[data-k]').forEach(e=>seen.add(e.dataset.k));scrollTo(0,sy);tick()}
const $=s=>document.querySelector(s);
var tick=function(){const c=$('#clk');if(c)c.textContent=hms();document.querySelectorAll('[data-live]').forEach(e=>e.textContent=hms());document.querySelectorAll('[data-rt]').forEach(e=>{const d=pm(e.dataset.rt)-nowM();e.textContent=d>0?`${d} phút`:'Sẵn sàng';e.classList.toggle('rd',d<=0)})}
function rem41(h){let d=((h-nowM())%1440+1440)%1440;if(d>720)d-=1440;return d}
const _t=tick;tick=function(){_t();document.querySelectorAll('[data-st]').forEach(e=>{const u=e.dataset.u==='1';let ds=((secs(e.dataset.dn)+(u?1800:0)-nowS())%86400+86400)%86400;if(ds>43200)ds-=86400;const d=ds>0?1:0;let t,k;if(u&&ds>0){t=`Ủ còn ${mmss(ds)}`;k='w'}else{t='Sẵn sàng';k='ok'}e.textContent=t;e.className='stc '+k;const cd=e.closest('.card');if(cd){const w=u&&d>0;cd.classList.toggle('pre',w);const ib=cd.querySelector('[data-a="idone"]');if(ib)ib.disabled=w}});
document.querySelectorAll('[data-ud]').forEach(e=>{const ds=incLeft({done:e.dataset.ud,incub:1});e.textContent=ds>0?'Ủ còn '+mmss(ds):'Ủ xong'});
document.querySelectorAll('[data-tk]').forEach(e=>{const d=rem41(+e.dataset.tk);e.classList.toggle('due',d<=0);e.classList.toggle('pre',d>0)});let n=0;document.querySelectorAll('[data-h41]').forEach(e=>{const d=rem41(+e.dataset.h41),o=d<=0,w=!o&&d<=15;e.classList.toggle('o41',o);e.classList.toggle('w41',w);const m=e.querySelector('[data-w41]');if(m)m.textContent=o?(d<0?`Quá giờ 41 (${-d} phút)`:'Đến giờ 41'):w?`Còn ${d} phút đến giờ 41`:'';if((o||w)&&e.closest('main'))n++});const al=$('#al41');if(al){al.textContent=n?`Cảnh báo: ${n} ca sắp tới / quá giờ 41`:'';al.style.display=n?'block':'none'}
document.querySelectorAll('[data-tot]').forEach(e=>{const c=cases[e.dataset.tot];if(!c)return;e.textContent=totTxt(c);const x=+c.eggs||0;e.style.color=x&&tot(c)!==x?'var(--warn)':''})};
/* ===== Cảnh báo ca mới cho người tiêm (khi ẩn/thu nhỏ cửa sổ) ===== */
const AL={on:false,shown:new Set(),tt:document.title,wl:null,n:0};
function alPending(){return role&&role!=='admin'?Object.values(cases).filter(c=>c.assignee===role&&!c.ack):[]}
function alNotify(c){try{if('Notification' in window&&Notification.permission==='granted'){const n=new Notification('Ca mới: '+c.name,{body:`STT ${c.sttch||c.stt||''} · Phân bố ${distT(c)} · Vị trí ${c.pos||'–'}`,tag:'ca'+c.id,requireInteraction:true,renotify:true});n.onclick=()=>{window.focus();n.close()}}}catch(e){}}
function alStart(){AL.on=true}
function alStop(){if(!AL.on)return;AL.on=false;document.title=AL.tt}
function alCheck(){const p=alPending(),ids=new Set(p.map(c=>c.id));
p.forEach(c=>{if(!AL.shown.has(c.id)){AL.shown.add(c.id);alNotify(c)}});
[...AL.shown].forEach(i=>{if(!ids.has(i))AL.shown.delete(i)});
if(p.length)alStart();else alStop()}
async function alWake(){try{if('wakeLock' in navigator&&!AL.wl&&role&&role!=='admin'){AL.wl=await navigator.wakeLock.request('screen');AL.wl.addEventListener('release',()=>{AL.wl=null})}}catch(e){}}
function alEnable(){alWake();try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission().then(render)}catch(e){}render()}
function alChip(){const ok='Notification' in window&&Notification.permission==='granted',no='Notification' in window&&Notification.permission==='denied';return `<button class="chip" data-a="aln" title="${no?'Trình duyệt đang chặn thông báo, hãy mở khóa trong cài đặt trang':'Bật thông báo pop-up khi có ca mới'}">${ok?'🔔 Đang bật':no?'🔕 Bị chặn':'🔔 Bật thông báo'}</button>`}
const _r=render;render=function(){_r();alCheck()};
setInterval(()=>{if(AL.on){AL.n++;document.title=AL.n%2?'🔔 CA MỚI – '+AL.tt:AL.tt;if(AL.n%3===0)try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}},1000);
document.addEventListener('focusout',()=>{if(pend){pend=false;setTimeout(render,60)}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)alWake()});
setInterval(()=>{if(!document.hidden)tick()},1000);
document.addEventListener('input',e=>{const t=e.target;if(t.classList.contains('tm')){const d=t.value.replace(/\D/g,'').slice(0,6);t.value=d.length>4?d.slice(0,2)+':'+d.slice(2,4)+':'+d.slice(4):d.length>2?d.slice(0,2)+':'+d.slice(2):d}if(t.dataset.t)tinp[t.dataset.t]=t.value;if(t.dataset.fin&&fin)fin[t.dataset.fin]=t.value});
document.addEventListener('change',async e=>{const t=e.target;
if(t.id==='f'&&t.files[0]){try{imp=parse(await t.files[0].arrayBuffer());imp.forEach(c=>c._s=true);if(!imp.length){alert('File không hợp lệ');imp=null}}catch(x){alert('Không đọc được file');imp=null}render()}
if(t.dataset.i!==undefined){imp[+t.dataset.i]._s=t.checked;const e=document.querySelector('.impw .sub');if(e)e.textContent=imp.filter(c=>c._s).length+'/'+imp.length+' ca được chọn'}if(t.dataset.ps){const v=t.value;t.blur();const f=t.dataset.f||'pos';save(t.dataset.ps,v==='__x'?{[f+'x']:true,[f]:''}:{[f+'x']:false,[f]:v})}else if(t.dataset.n==='done'){const v=nt(t.value);t.blur();if(v)save(t.dataset.id,{done:v});else render()}else if(t.dataset.t){const v=nt(t.value);if(v){t.blur();resort();save(t.dataset.t,{done:v});delete tinp[t.dataset.t]}}else if(t.dataset.n)saveQ(t.dataset.id,{[t.dataset.n]:t.value})})
document.addEventListener('click',e=>{if(thOpen&&!e.target.closest('.thp,[data-a="thm"]')){thOpen=false;render()}const b=e.target.closest('[data-a]');if(!b)return;const{a,id,v}=b.dataset;
if(a==='role'){role=v;ls('role',v);render();if(v!=='admin')alEnable()}
else if(a==='aln')alEnable()
else if(a==='cloudinfo')alert('Firebase từ chối ghi dữ liệu:\n'+RTERR+'\n\nHãy kiểm tra Realtime Database > Rules đã Publish đúng chưa (xem hướng dẫn).')
else if(a==='cloud'){const u=prompt('Địa chỉ Firebase Realtime Database (https://….firebasedatabase.app):',ls('fb_url')||'');if(u===null)return;const r=prompt('Mã phòng (chuỗi dài, bí mật, dùng chung cho mọi thiết bị):',ls('fb_room')||'');if(r===null)return;ls('fb_url',u.trim());ls('fb_room',r.trim());location.reload()}
else if(a==='out'){role=null;ls('role',null);render()}
else if(a==='tab'){tab=v;resort();render()}
else if(a==='mode')save(id,{mode:+v})
else if(a==='sp')save(id,{sperm:v})
else if(a==='theme'){themeI=+v;ls('theme',v);applyTheme(themeI);render()}
else if(a==='thm'){thOpen=!thOpen;render()}
else if(a==='bg'){bgI=+v;ls('bg',v);applyBg(bgI);render()}
else if(a==='savemode'){seen.delete('t'+id);resort();render()}
else if(a==='sort'){resort();render()}
else if(a==='now'){const c=cases[id];if(due(c)>0){early=id;render()}else{fin={id,d1:'',d2:'',pos:c.pos||'',t:hms()};render()}}
else if(a==='eback'){early=null;render()}
else if(a==='ego'){const c=cases[early];fin={id:early,d1:'',d2:'',pos:c.pos||'',t:hms()};early=null;render()}
else if(a==='fcancel'){fin=null;render()}
else if(a==='fsave'){const x=fin;fin=null;resort();save(x.id,{done:x.t,d1:x.d1,d2:x.d2,pos:x.pos})}
else if(a==='info'){openI.has(id)?openI.delete(id):openI.add(id);render()}
else if(a==='srt'){srt=v;ls('srt',v);render()}
else if(a==='okprep')save(id,{ok:true})
else if(a==='unprep')save(id,{mode:null,ok:false})
else if(a==='confirm'){const m=Object.values(cases).filter(c=>!c.done&&!c.mode);if(m.length){warn=m.map(c=>c.id)}else resort();render()}
else if(a==='wback'){warn=null;render()}
else if(a==='wgo'){warn=null;resort();render()}
else if(a==='time'){if(tinp[id]){resort();save(id,{done:tinp[id]});delete tinp[id]}}
else if(a==='inc')save(id,{incub:v==='1'})
else if(a==='asg'){if(cases[id]?.assignee!==v)save(id,{assignee:v,ack:false,icsiDone:null,asgAt:Date.now()})}
else if(a==='unasg')save(id,{assignee:null,ack:false})
else if(a==='undo'){resort();save(id,{done:null,assignee:null,ack:false})}
else if(a==='ack')save(id,{ack:true})
else if(a==='ackall')Object.values(cases).filter(c=>c.assignee===role&&!c.ack).forEach(c=>save(c.id,{ack:true}))
else if(a==='idone'){const c=cases[id];if(c.incub&&incLeft(c)>0)return;save(id,{icsiDone:hm(nowM())})}
else if(a==='all'){imp.forEach(c=>c._s=true);render()}
else if(a==='cancel'){imp=null;render()}
else if(a==='ok'){imp.filter(c=>c._s).forEach(c=>{delete c._s;if(!cases[c.id])save(c.id,c)});imp=null;resort();render()}
else if(a==='clear'){if(confirm('Xóa tất cả ca?'))Object.keys(cases).forEach(del)}})
bootDB();
render();
</script></body></html>
